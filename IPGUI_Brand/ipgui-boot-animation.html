  :root {
    --bg: #04070B;
    --ice: #E6F0FB;
    --slate: #8A9FB6;
    --dim: #6F849B;
    --cyan: #35E0FF;
    --blue: #508CFF;
    --violet: #8C5CFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 800px;
    height: 480px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Sora', 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 800px;
    height: 480px;
    overflow: hidden;
    background:
      radial-gradient(rgba(53,224,255,.055) 1px, transparent 1px),
      var(--bg);
    background-size: 28px 28px, 100% 100%;
  }

  .scene {
    position: absolute;
    inset: 0;
    animation: fadeOut .32s ease 2.75s forwards;
  }

  .glow {
    position: absolute;
    left: 180px;
    top: -30px;
    width: 440px;
    height: 400px;
    background: radial-gradient(ellipse at center, rgba(53,224,255,.18), rgba(80,140,255,.06) 48%, transparent 70%);
    filter: blur(6px);
    opacity: 0;
    animation: glowIn .9s ease .05s forwards;
  }

  .glow2 {
    position: absolute;
    left: 180px;
    bottom: -90px;
    width: 440px;
    height: 260px;
    background: radial-gradient(ellipse at center, rgba(140,92,255,.12), transparent 70%);
    opacity: 0;
    animation: glowIn 1.2s ease .2s forwards;
  }

  .bloom {
    position: absolute;
    left: 210px;
    top: 20px;
    width: 380px;
    height: 270px;
    background: radial-gradient(ellipse at center,
      rgba(53,224,255,.42), rgba(80,140,255,.14) 46%, transparent 72%);
    filter: blur(10px);
    opacity: 0;
    animation: bloom .78s ease-out .84s forwards;
  }

  .logo {
    position: absolute;
    inset: 0;
    width: 800px;
    height: 480px;
    overflow: visible;
  }

  .wm { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
  .tag { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; font-weight: 500; }

  .arc, .arc-glow {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw .70s cubic-bezier(.22, 1, .36, 1) .15s forwards;
  }

  .head {
    opacity: 0;
    offset-path: path("M300 300 A300 300 0 1 1 300 724");
    offset-rotate: 0deg;
    animation: head .70s cubic-bezier(.22, 1, .36, 1) .15s forwards;
  }

  .stem {
    transform: scaleY(0);
    transform-origin: 50% 0%;
    transform-box: fill-box;
    animation: stem .26s cubic-bezier(.22, 1, .36, 1) .88s forwards;
  }

  .dot {
    opacity: 0;
    transform: scale(.35);
    transform-origin: center;
    transform-box: fill-box;
    animation: dot .34s cubic-bezier(.34, 1.56, .64, 1) .72s forwards;
  }

  .dot-hi {
    opacity: 0;
    animation: fadeIn .18s ease .98s forwards;
  }

  .wordmark {
    opacity: 0;
    transform: translateY(10px);
    animation: rise .40s cubic-bezier(.22, 1, .36, 1) 1.04s forwards;
  }

  .tagline {
    opacity: 0;
    animation: fadeIn .32s ease 1.26s forwards;
  }

  .rule {
    transform: scaleX(0);
    transform-origin: center;
    transform-box: fill-box;
    animation: rule .36s cubic-bezier(.22, 1, .36, 1) 1.32s forwards;
  }

  .product {
    opacity: 0;
    transform: translateY(6px);
    animation: rise .32s cubic-bezier(.22, 1, .36, 1) 1.40s forwards;
  }

  .status {
    opacity: 0;
    animation: fadeIn .34s ease 1.55s forwards;
  }

  .bar-bg {
    opacity: 0;
    animation: fadeIn .3s ease 1.36s forwards;
  }

  .bar-fill {
    transform: scaleX(0);
    transform-origin: left;
    transform-box: fill-box;
    animation: bar 1.20s cubic-bezier(.22, 1, .36, 1) 1.38s forwards;
  }

  .replay {
    position: absolute;
    right: 16px;
    bottom: 14px;
    z-index: 20;
    padding: 7px 12px;
    border: 1px solid rgba(53,224,255,.25);
    border-radius: 999px;
    background: rgba(8,18,28,.82);
    color: #9AAFC6;
    font-size: 9px;
    letter-spacing: .18em;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .replay:hover { color: #E6F0FB; border-color: rgba(53,224,255,.55); }
  body.freeze .replay { display: none; }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes head {
    0%   { offset-distance: 0%;    opacity: 0; }
    8%   { opacity: 1; }
    86%  { opacity: 1; }
    100% { offset-distance: 100%;  opacity: 0; }
  }
  @keyframes stem { to { transform: scaleY(1); } }
  @keyframes dot  { to { opacity: 1; transform: scale(1); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes rule { to { transform: scaleX(1); } }
  @keyframes bar  { to { transform: scaleX(1); } }
  @keyframes glowIn { to { opacity: 1; } }
  @keyframes bloom {
    0%   { opacity: 0;   transform: scale(.88); }
    26%  { opacity: .85; transform: scale(1); }
    100% { opacity: 0;   transform: scale(1.05); }
  }
  @keyframes fadeOut { to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001s !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="scene">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="bloom"></div>

    <svg class="logo" viewBox="0 0 800 480">
      <defs>
        <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#35E0FF"/>
          <stop offset="0.52" stop-color="#508CFF"/>
          <stop offset="1" stop-color="#8C5CFF"/>
        </linearGradient>
        <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#35E0FF" stop-opacity="0"/>
          <stop offset="0.2" stop-color="#35E0FF" stop-opacity="0.65"/>
          <stop offset="0.8" stop-color="#8C5CFF" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#8C5CFF" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="22"/>
        </filter>
      </defs>

      <!-- mark -->
      <svg x="305" y="48" width="190" height="190" viewBox="190 190 644 644">
        <path class="arc-glow" pathLength="100"
              d="M300 300 A300 300 0 1 1 300 724"
              fill="none" stroke="url(#brand)" stroke-width="112"
              stroke-linecap="round" opacity="0.18" filter="url(#glow)"/>
        <path class="arc" pathLength="100"
              d="M300 300 A300 300 0 1 1 300 724"
              fill="none" stroke="url(#brand)" stroke-width="76"
              stroke-linecap="round"/>
        <rect class="head" x="-7" y="-7" width="14" height="14" rx="3"
              fill="#FFFFFF"/>
        <rect class="stem" x="238" y="384" width="38" height="256" rx="19"
              fill="#E6F0FB"/>
        <rect class="dot" x="222" y="318" width="70" height="70" rx="18"
              fill="url(#brand)"/>
        <rect class="dot-hi" x="240" y="336" width="18" height="18" rx="5"
              fill="#FFFFFF" opacity="0.6"/>
      </svg>

      <!-- wordmark -->
      <g class="wordmark">
        <text x="400" y="298" font-size="48" letter-spacing="-1"
              text-anchor="middle" class="wm" fill="#E6F0FB">IP<tspan fill="url(#brand)">G</tspan>UI</text>
      </g>

      <text class="tagline" x="400" y="326" font-size="8" letter-spacing="5"
            text-anchor="middle" class="tag" fill="#8A9FB6">VECTOR HMI ENGINE</text>

      <rect class="rule" x="350" y="344" width="100" height="1" fill="url(#ruleGrad)"/>

      <g class="product">
        <text x="400" y="368" font-size="12" letter-spacing="3"
              text-anchor="middle" class="tag" fill="#35E0FF">E-MOTION</text>
        <text x="400" y="384" font-size="7" letter-spacing="3"
              text-anchor="middle" class="tag" fill="#6F849B">ELECTRIC PERFORMANCE</text>
      </g>

      <rect class="bar-bg" x="290" y="424" width="220" height="2" rx="1" fill="#141E2B"/>
      <rect class="bar-fill" x="290" y="424" width="220" height="2" rx="1" fill="#35E0FF"/>

      <text class="status" x="400" y="444" font-size="8" letter-spacing="3"
            text-anchor="middle" class="tag" fill="#8A9FB6">SYSTEM CHECK</text>
    </svg>
  </div>

  <button class="replay" type="button">REPLAY</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const freeze = params.get('freeze');

  function allAnims() {
    return document.getAnimations();
  }

  if (freeze !== null) {
    document.body.classList.add('freeze');
    const t = parseFloat(freeze);
    if (!Number.isNaN(t)) {
      const apply = () => {
        requestAnimationFrame(() => {
          allAnims().forEach(a => {
            try {
              a.currentTime = t * 1000;
              a.pause();
            } catch (e) {}
          });
        });
      };
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(apply);
        setTimeout(apply, 800);
      } else {
        apply();
      }
    }
  } else {
    const restart = () => {
      allAnims().forEach(a => {
        try {
          a.currentTime = 0;
          a.play();
        } catch (e) {}
      });
    };
    const btn = document.querySelector('.replay');
    if (btn) btn.addEventListener('click', restart);
    setInterval(restart, 3400);
  }
</script>
</body>
</html>
