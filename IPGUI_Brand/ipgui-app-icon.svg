<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0FF"/>
      <stop offset="0.52" stop-color="#508CFF"/>
      <stop offset="1" stop-color="#8C5CFF"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0C1B2A"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#35E0FF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#508CFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#05080D" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tileGlow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5"
        fill="none" stroke="#1C3047" stroke-width="3"/>
  <rect x="28" y="28" width="456" height="456" rx="100"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

  <svg x="106" y="106" width="300" height="300" viewBox="190 190 644 644">
    <path d="M300 300 A300 300 0 1 1 300 724"
          fill="none" stroke="url(#brand)" stroke-width="112"
          stroke-linecap="round" opacity="0.18" filter="url(#glow)"/>
    <path d="M300 300 A300 300 0 1 1 300 724"
          fill="none" stroke="url(#brand)" stroke-width="76"
          stroke-linecap="round"/>
    <rect x="238" y="384" width="38" height="256" rx="19" fill="#E6F0FB"/>
    <rect x="222" y="318" width="70" height="70" rx="18" fill="url(#brand)"/>
    <rect x="240" y="336" width="18" height="18" rx="5" fill="#FFFFFF" opacity="0.55"/>
