<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;display=swap');
      .wordmark { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; font-weight: 700; }
      .tagline  { font-family: 'Sora', 'Segoe UI', Arial, sans-serif; font-weight: 500; }
    </style>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35E0FF"/>
      <stop offset="0.52" stop-color="#508CFF"/>
      <stop offset="1" stop-color="#8C5CFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35E0FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#35E0FF" stop-opacity="0.65"/>
      <stop offset="0.8" stop-color="#8C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8C5CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <svg x="295" y="18" width="210" height="210" viewBox="190 190 644 644">
    <path d="M300 300 A300 300 0 1 1 300 724"
          fill="none" stroke="url(#brand)" stroke-width="112"
          stroke-linecap="round" opacity="0.16" filter="url(#glow)"/>
    <path d="M300 300 A300 300 0 1 1 300 724"
          fill="none" stroke="url(#brand)" stroke-width="76"
          stroke-linecap="round"/>
    <rect x="238" y="384" width="38" height="256" rx="19" fill="#E6F0FB"/>
    <rect x="222" y="318" width="70" height="70" rx="18" fill="url(#brand)"/>
    <rect x="240" y="336" width="18" height="18" rx="5" fill="#FFFFFF" opacity="0.55"/>
  </svg>

  <text x="400" y="300" font-size="88" letter-spacing="-1.5" text-anchor="middle"
        class="wordmark" fill="#E6F0FB">IP<tspan fill="url(#brand)">G</tspan>UI</text>

  <text x="400" y="340" font-size="11" letter-spacing="5.8" text-anchor="middle"
        class="tagline" fill="#8A9FB6">VECTOR HMI ENGINE</text>

  <rect x="340" y="360" width="120" height="1.2" fill="url(#rule)"/>
</svg>
